[profile.default]
src = "src"
out = "out"
libs = ["lib/forge-std"]
test = "test/foundry"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "solc_0.8/=node_modules/hardhat-deploy/solc_0.8/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"
]

[fmt]
line_length = 120
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
